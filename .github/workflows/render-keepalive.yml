name: Keep Render API warm

on:
  push:
    branches:
      - main
  schedule:
    # Render Free spins down after 15 minutes without inbound traffic.
    # Offset runs away from the busy top of each hour.
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping API health endpoint through the frontend proxy
        run: curl --fail --silent --show-error --retry 2 --retry-delay 5 --max-time 30 https://driftpostpage.vercel.app/health
      - name: Verify Render CORS preflight for large uploads
        shell: bash
        run: |
          response="$(curl --silent --show-error --retry 2 --retry-delay 3 --max-time 30 -i -X OPTIONS https://driftpost.onrender.com/api/publish -H 'Origin: https://driftpostpage.vercel.app' -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: authorization,content-type' -w '\nHTTP_STATUS:%{http_code}')"
          printf '%s\n' "$response"
          normalized="$(printf '%s' "$response" | tr '[:upper:]' '[:lower:]' | tr -d '\r')"
          printf '%s' "$normalized" | grep -Fq 'http_status:204'
          printf '%s' "$normalized" | grep -Fq 'access-control-allow-origin: https://driftpostpage.vercel.app'
          printf '%s' "$normalized" | grep -Fq 'access-control-allow-methods: get,post,put,delete,options'
          printf '%s' "$normalized" | grep -Fq 'access-control-allow-headers: content-type,authorization,x-driftpost-ai-grant'
