    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
    <meta name="description" content="Schedule and publish social media posts across Instagram, Facebook, YouTube and X. Manage multiple brands and accounts in one workspace with platform-specific captions and media." />
    <meta name="robots" id="robots-meta" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://driftpostpage.vercel.app/" />

    <link rel="apple-touch-icon" href="/favicon-light.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Driftpost" />
    <meta property="og:title" content="Driftpost | Multi-Platform Social Media Scheduler" />
    <meta property="og:description" content="Schedule and publish posts to Instagram, Facebook, YouTube and X. Organize multiple brands and social accounts in one workspace." />
    <meta property="og:url" content="https://driftpostpage.vercel.app/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Driftpost | Multi-Platform Social Media Scheduler" />
    <meta name="twitter:description" content="Schedule and publish posts to Instagram, Facebook, YouTube and X. Organize multiple brands and social accounts in one workspace." />
    <link rel="icon" type="image/png" media="(prefers-color-scheme: light)" href="/favicon-light.png?v=3" />
    <link rel="icon" type="image/png" media="(prefers-color-scheme: dark)" href="/favicon-dark.png?v=3" />
    <link rel="icon" type="image/png" href="/favicon-dark.png?v=3" />
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Driftpost",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "url": "https://driftpostpage.vercel.app/",
      "description": "Social media scheduling and publishing workspace for managing multiple brands and accounts across Instagram, Facebook, YouTube and X.",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        { "@type": "Question", "name": "Is Driftpost free?", "acceptedAnswer": { "@type": "Answer", "text": "Yes while in beta. YouTube, Meta and Supabase free tiers cover normal agency volume." } },
        { "@type": "Question", "name": "Which platforms does Driftpost publish to?", "acceptedAnswer": { "@type": "Answer", "text": "YouTube, Instagram, Facebook and X — each with its native options like titles, tags, captions, polls and links." } },
        { "@type": "Question", "name": "Can Driftpost schedule posts across social platforms?", "acceptedAnswer": { "@type": "Answer", "text": "Yes. Choose a date and time when composing a post. Driftpost can publish scheduled content to connected platform accounts, subject to each platform's API and account permissions." } },
        { "@type": "Question", "name": "Where are my social tokens stored?", "acceptedAnswer": { "@type": "Answer", "text": "Encrypted in your own Supabase project. Disconnecting an account deletes them." } }
      ]
    }
    </script>
    <meta name="google-site-verification" content="jNkkaD-lqrqTWf3v2K523V6SKIA1je2OVUwxcfnjOlA" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="image" href="/logo-dark-620.png" imagesrcset="/logo-dark-620.png 620w, /logo-dark.png 1984w" imagesizes="248px" fetchpriority="high" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" /></noscript>
    <title>Driftpost | Social Media Scheduler for Multiple Brands</title>
  </head>
  <body>
    <div id="root">
      <main role="status" aria-live="polite" style="min-height:100vh;display:grid;place-content:center;justify-items:center;gap:14px;padding:24px;background:#10141b;color:#f4f6fb;font:500 15px system-ui,sans-serif;text-align:center">
        <span style="width:28px;height:28px;border:3px solid #43536f;border-top-color:#8b5cf6;border-radius:50%;animation:driftpost-spin .8s linear infinite"></span>
        <strong>Driftpost is loading…</strong>
        <p style="margin:0;color:#c3ccd9">If this page stays blank, <a href="/" style="color:#c4b5fd">reload Driftpost</a>.</p>
      </main>
    </div>
    <style>@keyframes driftpost-spin{to{transform:rotate(360deg)}}</style>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
